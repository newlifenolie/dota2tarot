<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dota Tarot</title>
  <meta name="description" content="Pick your lane and your heroes, and the Ancients will read your soul." />
  <meta property="og:title" content="Dota Tarot · 刀塔塔罗" />
  <meta property="og:description" content="A Dota 2 personality test and daily fortune. Pick your lane and heroes, and let the cards read you." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314101a'/%3E%3Cpath d='M16 3 L19 13 L29 16 L19 19 L16 29 L13 19 L3 16 L13 13Z' fill='%23d9b25f'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=10" />
</head>
<body>
  <!-- Turns hero art into a printed-tarot illustration: flat vintage colours, ink edges and a dark outline. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="tarot-ink" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceGraphic" result="poster">
        <feFuncR type="discrete" tableValues="0.13 0.36 0.58 0.78 0.94" />
        <feFuncG type="discrete" tableValues="0.09 0.29 0.5 0.7 0.88" />
        <feFuncB type="discrete" tableValues="0.06 0.21 0.38 0.55 0.74" />
      </feComponentTransfer>
      <feColorMatrix in="poster" type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0" result="gray" />
      <feConvolveMatrix in="gray" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" preserveAlpha="true" result="edges" />
      <feColorMatrix in="edges" type="matrix" values="0 0 0 0 0.17  0 0 0 0 0.11  0 0 0 0 0.05  1.6 1.6 1.6 0 0" result="lines" />
      <feComposite in="lines" in2="SourceAlpha" operator="in" result="innerLines" />
      <feMorphology in="SourceAlpha" operator="dilate" radius="1.4" result="thick" />
      <feFlood flood-color="#2b1b0e" />
      <feComposite in2="thick" operator="in" result="outline" />
      <feMerge><feMergeNode in="outline" /><feMergeNode in="poster" /><feMergeNode in="innerLines" /></feMerge>
    </filter>
  </svg>
  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en">EN</button><button data-lang="zh">中文</button>
    <button class="sound-btn" id="sound-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" /><path class="waves" d="M16.5 9 Q18.5 12 16.5 15 M19 6.5 Q23 12 19 17.5" /><path class="mute" d="M16.5 9.5 L21.5 14.5 M21.5 9.5 L16.5 14.5" /></svg>
    </button>
  </div>

  <!-- Intro -->
  <section class="screen active" id="screen-intro">
    <div class="intro">
      <div class="sigil" aria-hidden="true">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="sigil-core">✦</span>
      </div>
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 class="title"><span data-i18n="titleA"></span><span data-i18n="titleB"></span></h1>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="intro-actions">
        <button class="btn btn-primary" data-go="role" data-i18n="begin"></button>
        <button class="btn btn-ghost btn-daily" id="open-daily"><span aria-hidden="true">☾</span> <span data-i18n="dailyBtn"></span></button>
      </div>
    </div>
    <p class="fan-note" data-i18n="disclaimer"></p>
  </section>

  <!-- Step 1: role -->
  <section class="screen" id="screen-role">
    <header class="step-head">
      <p class="step-num" data-i18n="step1"></p>
      <h2 data-i18n="step1Title"></h2>
    </header>
    <div class="roles" id="roles"></div>
    <nav class="step-nav">
      <button class="btn btn-ghost" data-go="intro" data-i18n="back"></button>
      <button class="btn btn-primary" id="to-heroes" data-go="heroes" data-i18n="continue" disabled></button>
    </nav>
  </section>

  <!-- Step 2: heroes -->
  <section class="screen" id="screen-heroes">
    <header class="step-head">
      <p class="step-num" data-i18n="step2"></p>
      <h2 data-i18n="step2Title"></h2>
      <p class="hint" data-i18n="step2Hint"></p>
    </header>
    <div class="pickbar">
      <button class="btn btn-ghost" data-go="role" data-i18n="back"></button>
      <div class="picked" id="picked"></div>
      <button class="btn btn-primary" id="to-reading" data-i18n="draw" disabled></button>
    </div>
    <div class="toolbar">
      <input type="search" id="search" data-i18n-ph="search" autocomplete="off" />
      <div class="filters" id="filters">
        <button class="chip active" data-attr="all" data-i18n="all"></button>
        <button class="chip" data-attr="str"><i class="dot str"></i><span data-i18n="str"></span></button>
        <button class="chip" data-attr="agi"><i class="dot agi"></i><span data-i18n="agi"></span></button>
        <button class="chip" data-attr="int"><i class="dot int"></i><span data-i18n="int"></span></button>
        <button class="chip" data-attr="uni"><i class="dot uni"></i><span data-i18n="uni"></span></button>
      </div>
    </div>
    <div class="hero-grid" id="hero-grid"></div>
  </section>

  <!-- Step 3: reading -->
  <section class="screen" id="screen-reading">
    <header class="step-head">
      <p class="step-num" data-i18n="step3"></p>
      <h2 id="reading-prompt"></h2>
    </header>
    <div class="spread" id="spread"></div>
    <article class="result" id="result" hidden></article>
  </section>

  <!-- Daily fortune -->
  <section class="screen" id="screen-daily">
    <header class="step-head">
      <p class="step-num" data-i18n="dailyKicker"></p>
      <h2 id="daily-title"></h2>
      <p class="hint" id="daily-hint"></p>
    </header>
    <div class="fan" id="fan"></div>
    <div class="spread daily-stage" id="daily-stage"></div>
    <article class="result daily-result" id="daily-result" hidden></article>
    <nav class="step-nav" id="daily-nav">
      <button class="btn btn-ghost" data-go="intro" data-i18n="home"></button>
    </nav>
  </section>

  <script src="js/data.js?v=10"></script>
  <script src="js/i18n.js?v=10"></script>
  <script src="art/manifest.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
